name: Android offline build

on:
  push:
    branches:
      - feat/native-offline-foundation
      - main
  workflow_dispatch:

permissions:
  contents: write

# Multiple rapid commits previously ran APK uploads against the same release
# at once. Serialize the workflow per branch so release asset replacement
# cannot race and return stale-asset 404 errors.
concurrency:
  group: stoke-yange-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build the bundled native web app
        run: npm run build:native
        env:
          # Public client key only. Never use a service-role/secret key in a mobile app.
          NEXT_PUBLIC_SUPABASE_URL: https://hdsoxtlruzuadsqkapls.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Te3LfkYrNP1v2gUSqkcpDg_SupfSYqJ
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify the bundled entry point exists
        run: test -f .output/public/index.html

      - name: Create Android project
        run: npx cap add android

      - name: Prepare Stoke Yange native splash and icon source assets
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          
          out = Path("assets")
          out.mkdir(exist_ok=True)
          source = Image.open("public/icon-512.png").convert("RGBA")
          
          source.resize((1024, 1024), Image.Resampling.LANCZOS).save(out / "icon-only.png")
          
          foreground = Image.new("RGBA", (1024, 1024), (0, 0, 0, 0))
          mark = source.resize((660, 660), Image.Resampling.LANCZOS)
          foreground.alpha_composite(mark, ((1024 - mark.width) // 2, (1024 - mark.height) // 2))
          foreground.save(out / "icon-foreground.png")
          
          Image.new("RGBA", (1024, 1024), "#FAF8F5").save(out / "icon-background.png")
          
          splash = Image.new("RGBA", (2732, 2732), "#FAF8F5")
          mark = source.resize((560, 560), Image.Resampling.LANCZOS)
          splash.alpha_composite(mark, ((2732 - mark.width) // 2, (2732 - mark.height) // 2 - 70))
          draw = ImageDraw.Draw(splash)
          try:
              font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 112)
          except OSError:
              font = ImageFont.load_default()
          label = "Stoke Yange"
          bounds = draw.textbbox((0, 0), label, font=font)
          draw.text(((2732 - (bounds[2] - bounds[0])) // 2, 1730), label, fill="#382B24", font=font)
          splash.save(out / "splash.png")
          splash.save(out / "splash-dark.png")
          PY
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor "#FAF8F5" --splashBackgroundColor "#FAF8F5"

      - name: Copy bundled app into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload installable debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stoke-yange-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Public direct download URL used by Android Install buttons on the website.
      # This is a beta/debug-signed APK until a stable production signing key is configured.
      - name: Publish direct APK download for the website
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Stoke Yange Android" --notes "Direct Android APK download for Stoke Yange. Beta build." --prerelease
          cp android/app/build/outputs/apk/debug/app-debug.apk stoke-yange.apk
          gh release upload android-latest stoke-yange.apk --clobber
